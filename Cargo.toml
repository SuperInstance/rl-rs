[package]
name = "rl-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SuperInstance/rl-rs"
description = "Reinforcement learning in Rust — Q-learning, policy gradient, DQN, environments, reward shaping"

[dependencies]
serde = { version = "1", features = ["derive"] }
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
rand_chacha = "0.3"
